<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.url == "/" %}{{ page.title | default: site.title }}{% else %}{{ page.title | default: site.title }} | Kaydon{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --bg-hover: #16161a;
    --ink: #ededee;
    --ink-dim: #a1a1a8;
    --ink-dimmer: #75757e;
    --accent: #ff6a4a;
    --line: rgba(255,255,255,0.09);
    --bar: rgba(14,14,16,0.8);
    --radius: 10px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafaf9;
      --bg-hover: #f0f0ee;
      --ink: #17171a;
      --ink-dim: #52525a;
      --ink-dimmer: #6b6b73;
      --accent: #d4431f;
      --line: rgba(23,23,26,0.1);
      --bar: rgba(250,250,249,0.85);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 2rem; }

  /* ============ TOP BAR ============ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--line);
    background: var(--bar);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .topbar .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; }
  .topbar .brand { font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
  .topbar nav { display: flex; gap: 1.75rem; }
  .topbar nav a { color: var(--ink-dim); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
  .topbar nav a:hover { color: var(--ink); }

  /* ============ HERO ============ */
  .hero { padding-top: 6rem; padding-bottom: 4rem; }
  .hero h1 {
    font-size: clamp(2.4rem, 5.6vw, 4.4rem);
    font-weight: 500;
    line-height: 1.08;
    letter-spacing: -0.04em;
    margin-bottom: 1.75rem;
  }
  .hero h1 .line { display: block; overflow: hidden; padding-bottom: 0.06em; }
  .hero h1 .line > span { display: inline-block; }
  .hero h1 .muted { color: var(--ink-dimmer); }
  .hero p.lede { font-size: 1.1rem; color: var(--ink-dim); max-width: 46ch; }

  /* ============ HOME: label column + content column ============ */
  .home .content {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    column-gap: 3rem;
    padding-bottom: 2rem;
  }
  .home .content > * { grid-column: 2; }
  .home .content > h2 {
    grid-column: 1;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink-dim);
  }
  .home .content > h2,
  .home .content > h2 + * {
    margin-top: 4.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
  }
  .home .content > p { color: var(--ink-dim); font-size: 1.05rem; max-width: 68ch; }
  .home .content > p + p { margin-top: 1rem; }
  .home .content > h2 + p { color: var(--ink); }

  /* status line under the hero */
  .home .content > .status-row {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--ink-dimmer);
  }
  .badge.live { color: var(--accent); }

  /* ============ WORK LIST ============ */
  .project-grid { display: flex; flex-direction: column; }
  .project-card {
    display: grid;
    grid-template-columns: 11rem minmax(0, 1fr) 1.5rem;
    grid-template-areas: "tag title arrow" "tag desc arrow";
    column-gap: 2rem;
    row-gap: 0.25rem;
    padding: 1.35rem 1rem;
    margin: 0 -1rem;
    border-radius: var(--radius);
    color: var(--ink);
    text-decoration: none;
    position: relative;
    transition: background-color 0.35s var(--ease);
  }
  .project-card + .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 1rem; right: 1rem;
    height: 1px;
    background: var(--line);
  }
  .project-card:hover { background: var(--bg-hover); }
  .project-card .tag {
    grid-area: tag;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-dimmer);
    padding-top: 0.3rem;
  }
  .project-card h3 {
    grid-area: title;
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: -0.015em;
    transition: transform 0.45s var(--ease), color 0.3s;
  }
  .project-card p {
    grid-area: desc;
    color: var(--ink-dim);
    font-size: 0.95rem;
    line-height: 1.55;
    max-width: 62ch;
    transition: transform 0.45s var(--ease);
  }
  .project-card .arrow {
    grid-area: arrow;
    align-self: center;
    justify-self: end;
    color: var(--ink-dimmer);
    transition: transform 0.45s var(--ease), color 0.3s;
  }
  .project-card:hover h3 { color: var(--accent); transform: translateX(6px); }
  .project-card:hover p { transform: translateX(6px); }
  .project-card:hover .arrow { color: var(--accent); transform: translateX(4px); }
  .featured .project-card { padding-top: 1.75rem; padding-bottom: 1.75rem; }
  .featured .project-card h3 { font-size: 1.6rem; letter-spacing: -0.03em; }

  /* ============ ARTICLE (journal pages) ============ */
  .article { max-width: 720px; padding-top: 3.5rem; }
  .back {
    display: inline-flex;
    gap: 0.4rem;
    margin-bottom: 2.5rem;
    font-size: 0.88rem;
    color: var(--ink-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back span { transition: transform 0.35s var(--ease); }
  .back:hover { color: var(--ink); }
  .back:hover span { transform: translateX(-4px); }
  .article h1, .article h2, .article h3, .article h4 { letter-spacing: -0.02em; line-height: 1.25; margin: 2.75rem 0 0.8rem; font-weight: 600; }
  .article > .back + * { margin-top: 0; }
  .article h1 { font-size: clamp(2rem, 4.5vw, 2.75rem); font-weight: 500; letter-spacing: -0.035em; line-height: 1.12; }
  .article h2 { font-size: 1.45rem; }
  .article h3 { font-size: 1.15rem; }
  .article h4 { font-size: 1rem; color: var(--ink-dim); }
  .article p, .article li { font-size: 1.05rem; }
  .article p { margin: 1rem 0; }
  .article ul, .article ol { margin: 1rem 0 1rem 1.3rem; }
  .article li { margin: 0.4rem 0; }
  .article li::marker { color: var(--ink-dimmer); }
  .article strong { font-weight: 600; }
  .article code { font-family: var(--mono); font-size: 0.88em; padding: 0.1rem 0.35rem; border-radius: 5px; background: var(--bg-hover); }
  .article blockquote { border-left: 2px solid var(--accent); padding-left: 1.25rem; margin: 1.75rem 0; color: var(--ink-dim); }
  .article hr { border: none; height: 1px; background: var(--line); margin: 3rem 0; }
  .content a:not(.project-card):not(.back) {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
    transition: color 0.2s;
  }
  .content a:not(.project-card):not(.back):hover { color: var(--accent); }
  .article img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 2.25rem auto;
    border-radius: var(--radius);
    cursor: zoom-in;
  }

  /* ============ LIGHTBOX ============ */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(8,8,10,0.9);
    cursor: zoom-out;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s var(--ease), visibility 0s 0.35s;
  }
  .lightbox.open { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease); }
  .lightbox img {
    max-width: 92vw;
    max-height: 90dvh;
    border-radius: var(--radius);
    transform: scale(0.96);
    transition: transform 0.45s var(--ease);
  }
  .lightbox.open img { transform: none; }

  /* ============ FOOTER ============ */
  footer .wrap {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    padding-top: 2rem;
    padding-bottom: 2.5rem;
    color: var(--ink-dimmer);
    font-size: 0.85rem;
  }
  footer { border-top: 1px solid var(--line); margin-top: 6rem; }
  footer a { color: var(--ink-dim); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--ink); }

  /* ============ MOTION ============ */
  @media (prefers-reduced-motion: no-preference) {
    /* headline lines slide up out of a mask, then the lede and status follow */
    .hero h1 .line > span { animation: lineUp 1s var(--ease) both; }
    .hero h1 .line:nth-child(2) > span { animation-delay: 0.08s; }
    .hero p.lede { animation: fadeUp 0.9s 0.3s var(--ease) both; }
    .home .content > .status-row { animation: fadeUp 0.9s 0.45s var(--ease) both; }
    .article > * { animation: fadeUp 0.8s var(--ease) both; }
    .article > :nth-child(2) { animation-delay: 0.06s; }
    .article > :nth-child(n+3) { animation-delay: 0.12s; }
    @keyframes lineUp { from { transform: translateY(105%); } }
    @keyframes fadeUp { from { opacity: 0; translate: 0 14px; } }

    /* sections and rows rise in as they enter the viewport (CSS scroll-driven; static where unsupported) */
    @supports (animation-timeline: view()) {
      .home .content > h2, .home .content > h2 + p, .project-card, .article img {
        animation: rise linear both;
        animation-timeline: view();
        animation-range: entry 0% entry 50%;
      }
      @keyframes rise { from { opacity: 0; translate: 0 28px; } }
    }

    /* smooth fade between pages */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 0.25s var(--ease) both vtOut; }
    ::view-transition-new(root) { animation: 0.45s var(--ease) both vtIn; }
    @keyframes vtOut { to { opacity: 0; } }
    @keyframes vtIn { from { opacity: 0; translate: 0 10px; } }
  }

  /* ============ MOBILE ============ */
  @media (max-width: 760px) {
    .wrap { padding: 0 1rem; }
    .hero { padding-top: 3.5rem; padding-bottom: 2.5rem; }
    .home .content { display: block; }
    .home .content > h2 { margin-top: 3.5rem; }
    .home .content > h2 + * { margin-top: 0; padding-top: 0.5rem; border-top: none; }
    .project-card {
      grid-template-columns: minmax(0, 1fr) 1.25rem;
      grid-template-areas: "tag arrow" "title arrow" "desc arrow";
      column-gap: 1rem;
    }
    .project-card .tag { padding-top: 0; }
    .featured .project-card h3 { font-size: 1.35rem; }
    .article { padding-top: 2rem; }
  }
</style>
</head>
<body class="{% if page.url == '/' %}home{% else %}page{% endif %}">

<header class="topbar">
  <div class="wrap">
    <a href="/" class="brand">Kaydon</a>
    <nav>
      <a href="/#content">Work</a>
      <a href="https://github.com/kfidak13" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main>
  {% if page.url == "/" %}
  <section class="hero wrap">
    <h1>
      <span class="line"><span>I build useful things</span></span>
      <span class="line"><span class="muted">for the Webb community.</span></span>
    </h1>
    <p class="lede">Websites, Arduino experiments, and the journals behind them, from the Tech &amp; Innovation Seminar.</p>
  </section>
  <section class="content wrap" id="content">
    {{ content }}
  </section>
  {% else %}
  <article class="content article wrap" id="content">
    <a class="back" href="/"><span aria-hidden="true">←</span> All work</a>
    {{ content }}
  </article>
  {% endif %}
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Kaydon</span>
    <a href="https://github.com/kfidak13/kfidak13.github.io" target="_blank" rel="noopener">Source on GitHub</a>
  </div>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeLightbox = () => { lightbox.classList.remove('open'); document.body.style.overflow = ''; };
  document.querySelectorAll('.article img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
