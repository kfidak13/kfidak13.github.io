<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.url == "/" %}{{ page.title | default: site.title }}{% else %}{{ page.title | default: site.title }} | Kaydon{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --bg-elev: #121827;
    --bg-card: #141b2c;
    --ink: #eef0f4;
    --ink-dim: #a3abbd;
    --ink-dimmer: #7a8299;
    --accent: #ff6a4a;
    --accent-soft: rgba(255,106,74,0.12);
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --bar: rgba(11,15,26,0.72);
    --shadow: 0 24px 48px -28px rgba(0,0,0,0.75);
    --radius: 14px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --bg-elev: #eceef3;
      --bg-card: #ffffff;
      --ink: #131722;
      --ink-dim: #4a5163;
      --ink-dimmer: #666d80;
      --accent: #d9431f;
      --accent-soft: rgba(217,67,31,0.08);
      --line: rgba(19,23,34,0.09);
      --line-strong: rgba(19,23,34,0.18);
      --bar: rgba(246,247,249,0.8);
      --shadow: 0 24px 48px -30px rgba(40,48,70,0.35);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  /* one quiet glow behind the hero instead of animated blobs */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(900px 500px at 12% -10%, var(--accent-soft), transparent 70%);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* ============ TOP BAR ============ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 64px;
    padding: 0 2rem;
    border-bottom: 1px solid var(--line);
    background: var(--bar);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .topbar .brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--ink);
    text-decoration: none;
  }
  .topbar .brand span { color: var(--accent); }
  .topbar nav { display: flex; gap: 1.75rem; }
  .topbar nav a {
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 0.92rem;
    transition: color 0.2s;
  }
  .topbar nav a:hover { color: var(--ink); }

  /* scroll progress: CSS scroll-driven, no JS listener */
  .scroll-progress {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform-origin: left;
    transform: scaleX(0);
    z-index: 200;
  }
  @supports (animation-timeline: scroll()) {
    .scroll-progress { animation: grow linear both; animation-timeline: scroll(root); }
    @keyframes grow { to { transform: scaleX(1); } }
  }

  /* ============ HERO ============ */
  .hero {
    max-width: 1100px;
    margin: 0 auto;
    padding: 6rem 2rem 3rem;
  }
  .hero h1 {
    font-size: clamp(2.6rem, 6.5vw, 5rem);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.035em;
    margin-bottom: 1.5rem;
  }
  .hero h1 em { font-style: italic; color: var(--accent); padding-right: 0.05em; }
  .hero p.lede {
    font-size: 1.15rem;
    color: var(--ink-dim);
    max-width: 52ch;
    margin-bottom: 2.25rem;
  }
  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.85rem 1.6rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    transition: transform 0.25s var(--ease), box-shadow 0.25s;
  }
  .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px var(--accent); }
  .hero-cta:active { transform: translateY(0) scale(0.98); }
  .hero > * { animation: fadeUp 0.8s var(--ease) both; }
  .hero > :nth-child(2) { animation-delay: 0.1s; }
  .hero > :nth-child(3) { animation-delay: 0.2s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } }

  /* ============ CONTENT ============ */
  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
  }
  /* journal pages read as an article column */
  .article { max-width: 720px; }
  .back {
    display: inline-block;
    margin-bottom: 2rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink-dim);
    text-decoration: none;
  }
  .back:hover { color: var(--accent); }

  /* cards rise in as they scroll into view; CSS only, content stays visible where unsupported */
  @supports (animation-timeline: view()) {
    .project-card { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 60%; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  }

  .content h1, .content h2, .content h3, .content h4 {
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 2.75rem 0 0.9rem;
  }
  .content > :first-child, .content > .back + * { margin-top: 0; }
  .content h1 { font-size: clamp(2rem, 4.5vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; }
  .content h2 { font-size: clamp(1.45rem, 2.8vw, 1.8rem); font-weight: 600; }
  .content h3 { font-size: 1.2rem; font-weight: 600; }
  .content h4 { font-size: 1.05rem; font-weight: 600; color: var(--ink-dim); }
  .content p { margin: 1rem 0; max-width: 72ch; }
  .article p, .article li { color: var(--ink); font-size: 1.05rem; }
  .content a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .content a:hover { text-decoration-thickness: 2px; }
  .content ul, .content ol { margin: 1rem 0 1rem 1.4rem; }
  .content li { margin: 0.45rem 0; }
  .content li::marker { color: var(--accent); }
  .content strong { font-weight: 600; }
  .content code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg-elev);
    padding: 0.15rem 0.4rem;
    border-radius: 6px;
    font-size: 0.88em;
    border: 1px solid var(--line);
  }
  .content blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.25rem 0 0.25rem 1.25rem;
    margin: 1.75rem 0;
    color: var(--ink-dim);
    font-size: 1.1rem;
  }
  .content hr { border: none; height: 1px; background: var(--line-strong); margin: 3.5rem 0; }

  /* ============ IMAGES ============ */
  .content img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 2rem auto;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    cursor: zoom-in;
  }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(5,8,15,0.92);
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 92dvh;
    border-radius: var(--radius);
    animation: zoomIn 0.3s var(--ease);
  }
  @keyframes zoomIn { from { transform: scale(0.94); opacity: 0; } }

  /* ============ PROJECT CARDS ============ */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 1.25rem;
    margin: 1.5rem 0 1rem;
  }
  /* featured first card on wide screens, so grids don't read as identical rows */
  @media (min-width: 900px) {
    .project-grid > .project-card:first-child { grid-column: span 2; }
    .project-grid > .project-card:first-child h3 { font-size: 1.75rem; }
    .project-grid > .project-card:first-child p { max-width: 48ch; }
    /* exactly 3 cards already fill one row */
    .project-grid:has(> :nth-child(3):last-child) > .project-card:first-child { grid-column: auto; }
    .project-grid:has(> :nth-child(3):last-child) > .project-card:first-child h3 { font-size: 1.3rem; }
  }
  .project-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 1.6rem;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    text-decoration: none !important;
    transition: transform 0.3s var(--ease), border-color 0.3s, box-shadow 0.3s;
  }
  .project-card:hover {
    transform: translateY(-4px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow);
  }
  .project-card:active { transform: translateY(-1px) scale(0.99); }
  .project-card .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem;
    color: var(--ink-dimmer);
  }
  .project-card h3 { font-size: 1.3rem; margin: 0; color: var(--ink); }
  .project-card p { color: var(--ink-dim); font-size: 0.95rem; margin: 0; line-height: 1.55; }
  .project-card .arrow {
    margin-top: auto;
    padding-top: 0.5rem;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--accent);
    transition: transform 0.25s var(--ease);
  }
  .project-card:hover .arrow { transform: translateX(4px); }

  /* ============ STATUS BADGES ============ */
  .status-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0 0 2.5rem; }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }
  .badge.live { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ============ FOOTER ============ */
  footer {
    max-width: 1100px;
    margin: 6rem auto 0;
    padding: 2rem;
    border-top: 1px solid var(--line);
    color: var(--ink-dimmer);
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  footer a { color: var(--ink-dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ============ MOBILE ============ */
  @media (max-width: 640px) {
    .topbar { padding: 0 1rem; }
    .hero { padding: 3.5rem 1rem 1.5rem; }
    .content { padding: 1.5rem 1rem; }
    footer { padding: 2rem 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .scroll-progress { display: none; }
  }
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"></div>

<header class="topbar">
  <a href="/" class="brand">kfidak<span>13</span></a>
  <nav>
    <a href="/#content">Work</a>
    <a href="https://github.com/kfidak13" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  {% if page.url == "/" %}
  <section class="hero">
    <h1>Hey, I'm Kaydon.<br>I build <em>things</em> that work.</h1>
    <p class="lede">Projects, journals, and experiments from the Tech &amp; Innovation Seminar at Webb.</p>
    <a href="#content" class="hero-cta">See the work <span aria-hidden="true">→</span></a>
  </section>
  <section class="content" id="content">
    {{ content }}
  </section>
  {% else %}
  <article class="content article" id="content">
    <a class="back" href="/">← All work</a>
    {{ content }}
  </article>
  {% endif %}
</main>

<footer>
  <span>© 2026 Kaydon</span>
  <a href="https://github.com/kfidak13/kfidak13.github.io" target="_blank" rel="noopener">Source on GitHub</a>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
  // Lightbox for images in content
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeLightbox = () => { lightbox.classList.remove('open'); document.body.style.overflow = ''; };
  document.querySelectorAll('.content img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
